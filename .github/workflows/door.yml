name: door

# pull_request_target runs this workflow and scripts/check_push.py from the base
# branch. A pull request is fetched as git data and never executed, so it cannot
# rewrite the check that judges it. Keep it that way: no step here may run a file
# that comes from the pull request, and the token stays read-only.
on:
  pull_request_target:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the pull request as data
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head"
      - name: Contributor door
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/check_push.py
